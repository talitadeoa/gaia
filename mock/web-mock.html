<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Gaia — Liquid Glass Mock</title>
<style>
  :root {
    --bg: #0b0d11;
    --bg-rgb: 11, 13, 17;
    --panel: rgba(20, 24, 32, 0.72);
    --panel-solid: #141820;
    --panel2: rgba(28, 34, 46, 0.68);
    --line: rgba(255,255,255,0.10);
    --fg: #f0f4f9;
    --dim: #9aa7b5;
    --accent: #64d8a8;
    --accent-rgb: 100, 216, 168;
    --warn: #f2c94c;
    --err: #ff7d7d;
    --user: rgba(100, 216, 168, 0.18);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --glass-border: rgba(255,255,255,0.12);
    --glass-bg: rgba(255,255,255,0.06);
    --glass-shadow: 0 8px 32px rgba(0,0,0,0.35);
    --radius: 16px;
    --radius-sm: 10px;
    --radius-lg: 22px;
    --space: 8px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f7fa;
      --bg-rgb: 245, 247, 250;
      --panel: rgba(255,255,255,0.72);
      --panel-solid: #fff;
      --panel2: rgba(235,240,248,0.68);
      --line: rgba(0,0,0,0.08);
      --fg: #1b2026;
      --dim: #5f6b78;
      --accent: #0f9b6e;
      --accent-rgb: 15, 155, 110;
      --warn: #c79a00;
      --err: #d93a3a;
      --user: rgba(15, 155, 110, 0.14);
      --glass-border: rgba(0,0,0,0.08);
      --glass-bg: rgba(255,255,255,0.55);
      --glass-shadow: 0 8px 32px rgba(0,0,0,0.10);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 10% 20%, rgba(var(--accent-rgb), 0.12), transparent 35%),
      radial-gradient(circle at 90% 80%, rgba(120, 160, 255, 0.10), transparent 35%),
      var(--bg);
    color: var(--fg);
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; grid-template-rows: auto 1fr auto; min-height: 100dvh;
  }
  .glass { background: var(--glass-bg); backdrop-filter: blur(18px) saturate(160%); border: 1px solid var(--glass-border); box-shadow: var(--glass-shadow); }
  .pill { font-size: 12px; border-radius: 999px; padding: 5px 12px; white-space: nowrap; }
  .pill.glass { background: var(--panel); }
  button { border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--fg); border-radius: var(--radius-sm); padding: 8px 14px; cursor: pointer; font: inherit; transition: transform .08s, box-shadow .2s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  button.primario { background: var(--accent); color: #06100b; border-color: transparent; }
  header { display: flex; align-items: center; gap: var(--space); padding: 10px 18px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0; letter-spacing: .04em; }
  .header-group { display: flex; align-items: center; gap: var(--space); padding: 4px 6px; border-radius: var(--radius); }
  #status { flex: 1; color: var(--dim); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 8ch; }
  main { display: grid; grid-template-columns: 84px minmax(0, 1fr) 320px; min-height: 0; gap: var(--space); padding: var(--space); }
  @media (max-width: 820px) { main { grid-template-columns: 64px minmax(0, 1fr); } aside { display: none; } }
  #rail-bots { border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: var(--space); padding: 12px 8px; overflow-y: auto; border-radius: 0; }
  .bot-avatar { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 14px; font-weight: 700; font-size: 13px; margin: 0 auto; }
  .bot-avatar.atual { background: var(--accent); color: #06100b; box-shadow: 0 0 16px color-mix(in srgb, var(--accent) 45%, transparent); }
  .bot-avatar:not(.atual) { background: var(--panel); color: var(--dim); border: 1px solid var(--glass-border); }
  .add-bot { width: 44px; height: 44px; border-radius: 14px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--dim); }
  #chat { overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 76ch; padding: 14px 16px; border-radius: var(--radius-lg); white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.say { background: var(--panel); border: 1px solid var(--glass-border); }
  .msg.user { align-self: flex-end; background: var(--user); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
  aside { overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; border-radius: var(--radius); }
  .card { border-radius: var(--radius); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  footer { padding: 12px 18px; border-top: 1px solid var(--line); }
  .composer { display: flex; gap: 12px; align-items: flex-end; }
  textarea { flex: 1; resize: none; min-height: 48px; max-height: 38vh; padding: 12px 14px; border-radius: var(--radius); border: 1px solid var(--glass-border); background: var(--glass-bg); color: var(--fg); font: inherit; }
  textarea:focus { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
</style>
</head>
<body class="glass">
<header class="glass">
  <div class="header-group"><h1>gaia</h1><span class="pill glass ok">conectada</span></div>
  <div class="header-group"><span class="pill glass mono">gpt-4o-mini</span><span class="pill glass">openai</span></div>
  <span id="status">pronta para conversar</span>
  <div class="header-group" style="margin-left:auto">
    <button>automações</button><button>backlog</button><button>+ novo</button><button class="primario">+ bot</button>
  </div>
</header>
<main>
  <nav id="rail-bots">
    <div class="bot-avatar atual" title="Gaia">GA</div>
    <div class="bot-avatar" title="Donna">DH</div>
    <div class="bot-avatar" title="Ariana">AG</div>
    <div class="bot-avatar" title="Sabrina">SC</div>
    <div class="bot-avatar" title="Ada">AL</div>
    <button class="add-bot glass" title="adicionar bot">+</button>
  </nav>
  <section id="chat">
    <div class="msg say glass"><strong>gaia</strong><br>Olá! Como posso ajudar?</div>
    <div class="msg user">Quero agendar um lembrete.</div>
    <div class="msg say glass"><strong>gaia</strong><br>Claro. Me diga o que lembrar e a hora.</div>
  </section>
  <aside class="glass">
    <div class="card glass"><div class="dica">motor</div><strong>gpt-4o-mini · openai</strong></div>
    <div class="card glass"><div class="dica">automações</div>2/3 ligadas</div>
  </aside>
</main>
<footer class="glass">
  <div class="composer">
    <textarea rows="1" placeholder="Escreva para a Gaia…"></textarea>
    <button class="primario">enviar</button>
  </div>
</footer>
</body>
</html>
